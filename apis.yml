  name: Deakin University DataCite repository (ARDCX.DEAKIN)
  description: >-
    Deakin's own DataCite repository account, held under the ARDC (Australian Research Data Commons)
    consortium since 2020-05-14, with DOI prefix 10.26187. 4,597 DOIs are registered against it and
