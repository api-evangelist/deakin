apis:
  - aid: deakin:dro-oai
    name: Deakin Research Online (DRO) OAI-PMH
    description: >-
      Deakin Research Online is the university's research repository, now hosted on the figshare platform.
      It exposes research-output metadata for harvesting via the OAI-PMH protocol. The DRO host issues a
      bot-challenge response to automated clients; the underlying figshare OAI-PMH service is publicly reachable.
    humanURL: https://dro.deakin.edu.au/
    baseURL: https://api.figshare.com/v2/oai
    tags:
