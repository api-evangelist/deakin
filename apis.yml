aid: deakin
name: Deakin University
description: >-
  Deakin University is a public research university in Victoria, Australia, with campuses in
  Geelong, Warrnambool and Melbourne. Its genuinely institution-operated programmable footprint is
  small, real, and entirely in identity federation. Deakin self-publishes a complete SAML 2.0
  EntityDescriptor at signon.deakin.edu.au/idp/shibboleth for a Shibboleth identity provider it runs
  on its own APNIC address space (128.184.0.0/16, netname DEAKINUNIVERSITY) under a Deakin-procured
  DigiCert certificate, and it registers that IdP plus three production service providers — the
  Deakin Data Portal, Envirocare and OT Simulations — in the Australian Access Federation. That
  metadata document is the only institution-operated machine-readable contract in this profile, and
  it is what earns Deakin its SAML and Shibboleth conformance. Deakin is also the registrant behind
  4,597 DataCite DOIs (prefix 10.26187, repository ARDCX.DEAKIN under ARDC) and 1,303 Crossref
  deposits (member 8935, prefix 10.21153). Everything else that looks like a Deakin API belongs to a
  platform Deakin buys: Deakin Research Online is figshare (dro.deakin.edu.au CNAMEs to
  proxy-eu-01.figshare.com), CloudDeakin is D2L Brightspace (d2l.deakin.edu.au CNAMEs to
  deakin.brightspace.com, and its keyless Valence version manifest is the only JSON API answering on
  any deakin.edu.au host), library discovery resolves into Ex Libris address space, and the
  federated SSO endpoints registered with AAF sit on AAF's managed Rapid IdP on Amazon
  infrastructure. Those are recorded here as tenant relationships, not as Deakin contracts. There is
  no central developer portal, no institution-operated OAI-PMH endpoint, and no public course or
  campus API. The wider deakin.edu.au web estate — www, blogs, the Data Portal, the handbook — sits
  behind F5/Shape bot protection that answers automated clients with a JavaScript challenge, so it
  is not machine-readable at all.
