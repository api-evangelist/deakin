  - Managed Service
  properties:
  - type: IdentityFederation
    url: https://md.aaf.edu.au/aaf-metadata.xml
  - type: Documentation
    url: identity-federation/deakin-identity-federation.yml
- aid: deakin:dataportal
  name: Deakin Data Portal
  description: >-
    Deakin's research data portal, used to share datasets and collected materials with the
    Australian research community. Institution-operated: dataportal.deakin.edu.au CNAMEs to
    aafapp-p7-web-2020013100-prod.aa-global.deakin.edu.au inside Deakin's own 128.184.0.0/16, and it
    is registered in the AAF aggregate as the Shibboleth service provider
    https://dataportal.deakin.edu.au/shibboleth ("Deakin Data Portal", organization Deakin
    University). Deakin's GitHub organization carries forks of ReDBox, Mint and The Fascinator,
    which is the research-data-management stack this class of portal is normally built on. No
    contract could be read from it: every path, including /api, /mint/ and /redbox/, returns an
    F5/Shape JavaScript challenge page rather than content, so no OAI-PMH or REST surface is claimed
    here.
  humanURL: https://dataportal.deakin.edu.au/
  baseURL: https://dataportal.deakin.edu.au/
