- aid: deakin:dro-figshare
  name: Deakin Research Online (DRO) — figshare tenant
  description: >-
    Deakin Research Online is Deakin's institutional research repository, running on figshare.
    dro.deakin.edu.au is a CNAME to proxy-eu-01.figshare.com and returns HTTP 202 with a zero-byte
    body to automated clients. The data, the DOIs and the collection policy are Deakin's; the
    contract is figshare's and is deliberately NOT saved in this repository — the June 2026 profile
    saved it as eleven Deakin APIs, and all of it was removed on 2026-08-30. figshare's own generic
    OAI-PMH and REST v2 endpoints live on api.figshare.com and belong to figshare's profile.
  humanURL: https://dro.deakin.edu.au/
  baseURL: https://dro.deakin.edu.au/
  x-operator: tenant
  tags:
