x-coverage:
  state: covered
  reason: no_public_api
  detail: >-
    Deakin publishes no public developer API, no developer portal and no OpenAPI, and this profile
    says so rather than padding it. What it does operate was confirmed by IP ownership and
    certificate procurement rather than by hostname: signon.deakin.edu.au serves a complete SAML 2.0
    EntityDescriptor (HTTP 200, application/xml, 4,826 bytes) from 128.184.0.0/16, which APNIC
    attributes to DEAKINUNIVERSITY, on a certificate issued to O=Deakin University. That document is
    saved here. The Deakin Data Portal is a second institution-operated surface on the same address
    space, registered in AAF as a Shibboleth SP, but it returns an F5/Shape JavaScript challenge
    body on every path — as do www.deakin.edu.au (HTTP 403), blogs.deakin.edu.au (HTTP 200 with a
    challenge body, including /wp-json/ and /feed/), handbook.deakin.edu.au and
    research.deakin.edu.au — so no contract could be read from any of them.

    This profile is a correction. The June 2026 run attributed eleven APIs and 53 derived artifacts
    to Deakin that were one figshare contract: every OpenAPI carried info.title "Figshare …",
    contact "Figshare Support" and servers https://api.figshare.com/v2, and the same document is
    shipped by eleven other institutions in this cohort. All 53 files were removed on 2026-08-30 and
    the figshare relationship is recorded as a tenant surface instead. Expect the score to fall;
    that is the correction working.
apis:
- aid: deakin:saml-idp
  name: Deakin University SAML 2.0 Identity Provider
  description: >-
    Deakin's Shibboleth identity provider, self-hosted and self-described. The EntityDescriptor at
    https://signon.deakin.edu.au/idp/shibboleth declares protocol support for SAML 2.0, a signing
    and an encryption key, a shibmd:Scope of deakin.edu.au, three SingleSignOnService bindings
    (HTTP-POST, HTTP-POST-SimpleSign, HTTP-Redirect) and two SingleLogoutService bindings, all
    located on signon.deakin.edu.au. The host CNAMEs to
    shib-idp5-shib-2024061000-prod.aa-global.deakin.edu.au and resolves into 128.184.0.0/16
    (APNIC netname DEAKINUNIVERSITY) under a Deakin-procured DigiCert wildcard certificate. This is
    the only institution-operated machine-readable contract found anywhere in Deakin's public
    footprint.
  humanURL: https://signon.deakin.edu.au/
  baseURL: https://signon.deakin.edu.au/idp/
  x-operator: institution
  tags:
  - Identity Federation
  - SAML
  - Shibboleth
  - SSO
  tags_raw:
  - Identity Federation
  - SAML
  - Shibboleth
  - Single Sign-On
  properties:
  - type: IdentityFederation
    url: https://signon.deakin.edu.au/idp/shibboleth
  - type: Metadata
    url: identity-federation/deakin-idp-saml-metadata.xml
  - type: Conformance
    url: conformance/deakin-conformance.yml
  - type: Documentation
    url: identity-federation/deakin-identity-federation.yml
- aid: deakin:aaf-federated-idp
  name: Deakin University federated SSO (AAF Rapid IdP)
  description: >-
    The federation-registered deployment of the same entityID. In the AAF production aggregate,
    https://signon.deakin.edu.au/idp/shibboleth carries SingleSignOnService locations on
    aaf.deakin.edu.au, which CNAMEs to ec9a7f24c761e9b79a6c8c40560c805e.idp-cname.aaf.edu.au and
    resolves to Amazon address space (AT-88-Z) on an Amazon-issued certificate — AAF's fully managed
    Rapid IdP. Registered 2025-11-09, carrying REFEDS Research & Scholarship, REFEDS Code of Conduct
    v2, the GEANT Data Protection Code of Conduct and REFEDS Sirtfi assurance. The identity data and
    attribute release are Deakin's; the infrastructure and the metadata-serving endpoint are AAF's,
    so this is recorded as a tenant relationship and not as a second Deakin contract.
  humanURL: https://aaf.edu.au/subscribers/rapididp/
  baseURL: https://aaf.deakin.edu.au/idp/
  x-operator: tenant
  tags:
  - Identity Federation
  - SAML
