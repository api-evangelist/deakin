- aid: deakin:clouddeakin
  name: CloudDeakin — D2L Brightspace tenant
  description: >-
    Deakin's learning management system. d2l.deakin.edu.au CNAMEs to deakin.brightspace.com on AWS
    ap-southeast-2. Its keyless D2L Valence version manifest at /d2l/api/versions/ answers HTTP 200
    with application/json (2,400 bytes) listing fifteen product codes including lti, le, lp, ep and
    campusLife — the only JSON API contract that responds to an automated client on any
    deakin.edu.au hostname. It is D2L's contract on Deakin's tenant, so it is recorded as a tenant
    surface and the specification is not saved here.
  humanURL: https://d2l.deakin.edu.au/
